# standard — the guild's build template (design v5 §6.1).
#
# Plan-gated feature chain: approve the plan, then run to completion.
#
# EXACTLY TWO GATES, AND THEIR PLACEMENT IS THE POINT. The plan is the cheapest place to
# change your mind; after that, stopping to ask again mid-build converts agent time into
# the guild master's time. Problems found during the run are COLLECTED and surface
# together at `gate-repairs`.
#
# A requirement is therefore exactly two segments — `implement -> review`, and `repair`.
#
# This file is DATA. `guild graph new REQ-NNN --template standard` instantiates it.
# A project may override it at `.guild/templates/standard.yaml`; nothing else about the
# machinery changes. The parser accepts the subset used here and refuses anything else
# by name and line number — see `_graph_parse_template` in scripts/lib/graph.sh.
#
# THE GATES ARE NOT NEGOTIABLE. `guild graph deviate` refuses to drop one and refuses to
# add one, and `guild graph validate` refuses a graph that has managed either. Dropping a
# gate removes the guild master's control surface; ADDING one quietly turns unattended
# operation into a session that stops every twenty minutes.

name: standard
description: Plan-gated feature chain — approve the plan, then run to completion.

nodes:
  # ---- GATE 1: the only approval before anything is built ----
  - key: gate-plan
    kind: gate
    prompt: "Plan for {requirement} is ready for review. Approve implementation?"
    required: true

  # ---- continuous run: nothing below stops for the guild master ----
  - key: implement
    needs: [implement]
    after: [gate-plan]
    fanout: per-slice
    parallel: by-group
    required: true

  - key: test-plan
    needs: [test-planning]
    after: [implement]

  - key: test-write
    needs: [test-authoring]
    after: [test-plan]
    fanout: per-declaration

  - key: review
    after: [test-write]
    fanout: fixed
    agents: [reviewer-security, reviewer-architecture, reviewer-business-logic, reviewer-edge-case]
    parallel: all
    required: true

  # ---- GATE 2: report problems, approve repairs ----
  - key: gate-repairs
    kind: gate
    after: [review]
    prompt: "Findings and bugs from {requirement} — approve which get repaired."
    kind_detail: select-findings
    required: true

  - key: repair
    needs: [implement]
    after: [gate-repairs]
    fanout: per-approved-finding
    parallel: by-group
