<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Guild Dashboard</title>
<!--
  Generated by `guild dashboard` (guild v5, design doc §9). SELF-CONTAINED: every byte of
  CSS, JS and data is inline. No CDN, no external font, no remote image, no fetch — the
  file works offline, from file://, forever.

  THE DATA IS UNTRUSTED. Titles, agent names, bodies and event payloads are typed by
  humans and agents, and a title of `</script><script>alert(1)</script>` is a realistic
  value, not a hypothetical one. Two independent defenses, and each is sufficient alone:

    1. The inlined JSON contains NO `<`, `>` or `&` BYTE AT ALL. `guild dashboard`
       rewrites all three as their six-character JSON escapes — \u003c / \u003e / \u0026 —
       after the engine has produced the JSON. (Those escape sequences are the whole
       claim; a copy of this comment in which they have collapsed into the bare characters
       they denote is describing an identity transform, and is wrong.) Those three
       characters appear in no JSON structural token, so the rewrite is lossless and
       total — and with no `<` in the document, no byte sequence can close this element or
       open another one.
    2. Every value from the database reaches the DOM through `textContent` (or a numeric
       CSS width). `innerHTML`, `outerHTML`, `insertAdjacentHTML`, `document.write`,
       `eval` and `new Function` appear NOWHERE below. Adding one would reintroduce the
       hole that defense 1 closes; don't.

  DETERMINISM. `guild dashboard` writes the same bytes for the same database state, so
  the file diffs cleanly if it is ever committed. Nothing here embeds a wall clock: every
  timestamp in the data is one the database stored, and every "3 days ago" is computed in
  the browser at view time, from the reader's own clock.
-->
<style>
/* ---- tokens ------------------------------------------------------------------
   Light is defined on bare :root so the palette is complete without a media query;
   the dark block redefines only the tokens. body carries an explicit background —
   a transparent body borrows whatever is behind it. */
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #f0f2f5;
  --ink: #15181d;
  --muted: #5b6270;
  --line: #dfe3e9;
  --accent: #3b5bdb;
  --accent-ink: #ffffff;
  --ok: #2c7a4b;
  --warn: #a4700a;
  --bad: #c23b3b;
  --info: #3b5bdb;
  --p1: #c23b3b;
  --p2: #cf7a1c;
  --p3: #3b5bdb;
  --p4: #6b7280;
  --p5: #9aa1ad;
  --shadow: 0 1px 2px rgba(16, 20, 30, .06), 0 4px 12px rgba(16, 20, 30, .05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101318;
    --panel: #181c23;
    --panel-2: #1f242d;
    --ink: #e6e9ef;
    --muted: #98a0b0;
    --line: #2a3038;
    --accent: #7d93f0;
    --accent-ink: #10131a;
    --ok: #5cbb82;
    --warn: #d9a13c;
    --bad: #e8736f;
    --info: #7d93f0;
    --p1: #e8736f;
    --p2: #d9a13c;
    --p3: #7d93f0;
    --p4: #98a0b0;
    --p5: #6f7787;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 64px; }

/* ---- header ---- */
header.top { border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; margin-top: 16px; }
.tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tile .n { font-size: 22px; font-weight: 650; letter-spacing: -.02em; display: block; }
.tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.tile.alert .n { color: var(--bad); }
/* A tile is a headline number, and every headline number here has a view that lists the
   rows it counted — so the tile is an anchor to that view. `#findings` is a same-document
   fragment: no request leaves the page, which is the one thing this file may never do. */
a.tile { display: block; text-decoration: none; color: inherit; }
a.tile:hover { border-color: var(--accent); }
a.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- tabs ---- */
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 10px 0 0; scrollbar-width: thin; }
nav.tabs button {
  font: inherit; font-size: 14px; color: var(--muted); background: transparent;
  border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0;
  padding: 8px 14px; cursor: pointer; white-space: nowrap;
}
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] {
  color: var(--ink); background: var(--panel); border-color: var(--line);
  font-weight: 600; margin-bottom: -1px;
}
nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* ---- panels ---- */
section.view { display: none; }
section.view.on { display: block; }
h2 { font-size: 16px; margin: 22px 0 10px; }
h2:first-child { margin-top: 4px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; margin: 0 0 12px; box-shadow: var(--shadow);
}
.empty {
  background: var(--panel); border: 1px dashed var(--line); border-radius: 12px;
  padding: 22px; color: var(--muted); text-align: center;
}
.empty strong { display: block; color: var(--ink); margin-bottom: 6px; font-size: 15px; }

/* ---- generic bits ---- */
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; color: var(--muted); }
.title { font-weight: 560; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.pill {
  display: inline-block; font-size: 11.5px; line-height: 1.6; padding: 0 8px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2);
  color: var(--muted); white-space: nowrap;
}
.pill.ok { color: var(--ok); border-color: currentColor; }
.pill.warn { color: var(--warn); border-color: currentColor; }
.pill.bad { color: var(--bad); border-color: currentColor; }
.pill.info { color: var(--info); border-color: currentColor; }
.bar { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; flex: 0 0 96px; width: 96px; }
.bar > i { display: block; height: 100%; background: var(--accent); }

/* ---- roadmap ---- */
.goal { border-left: 4px solid var(--accent); }
.phase { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; background: var(--panel-2); }
.reqline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-top: 1px dashed var(--line); }
.reqline:first-of-type { border-top: none; }

/* ---- board ---- */
.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { flex: 1 0 262px; min-width: 262px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.col > h3 { font-size: 13px; margin: 2px 4px 10px; display: flex; justify-content: space-between; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.task { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--p3); border-radius: 9px; padding: 9px 10px; margin-bottom: 8px; }
.task.pr1 { border-left-color: var(--p1); }
.task.pr2 { border-left-color: var(--p2); }
.task.pr3 { border-left-color: var(--p3); }
.task.pr4 { border-left-color: var(--p4); }
.task.pr5 { border-left-color: var(--p5); }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
select, .controls label { font: inherit; font-size: 13.5px; color: var(--ink); }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; max-width: 100%; }

/* ---- severity groups (findings) ---- */
h3.grp {
  font-size: 12px; margin: 20px 0 8px; color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .04em;
  display: flex; align-items: baseline; gap: 8px;
}
h3.grp:first-child { margin-top: 8px; }

/* ---- tables ---- */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; position: sticky; top: 0; background: var(--panel); }
tr:last-child td { border-bottom: none; }
td.wrap-cell { white-space: normal; min-width: 220px; overflow-wrap: anywhere; }
td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }

/* ---- graph ----
   `pre.mermaid` is the class an Artifact host's native Mermaid renderer looks for, so the
   same block is source text in the local file and a rendered DAG when the page is
   published. These rules style the source form; a renderer that claims the block replaces
   its content and they stop applying. */
pre.code, pre.mermaid {
  margin: 0; padding: 12px 14px; overflow-x: auto; background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 10px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px;
}
footer.foot { color: var(--muted); font-size: 12.5px; margin-top: 28px; border-top: 1px solid var(--line); padding-top: 12px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap" style="padding-bottom:0">
    <div class="brand">
      <h1>Guild</h1>
      <span class="sub" id="hdr-sub"></span>
    </div>
    <div class="tiles" id="tiles"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<div class="wrap" id="content">
  <noscript>
    <div class="empty"><strong>This dashboard needs JavaScript</strong>
      It renders entirely in the page so the file stays self-contained and offline.
      The underlying data is available from <span class="mono">guild dashboard --json</span>
      — that is this page's own document; <span class="mono">guild brief --json</span> is a
      different, narrower surface.</div>
  </noscript>

  <section class="view" id="view-roadmap" role="tabpanel" aria-labelledby="tab-roadmap"></section>
  <section class="view" id="view-board" role="tabpanel" aria-labelledby="tab-board"></section>
  <section class="view" id="view-graph" role="tabpanel" aria-labelledby="tab-graph"></section>
  <section class="view" id="view-bugs" role="tabpanel" aria-labelledby="tab-bugs"></section>
  <section class="view" id="view-findings" role="tabpanel" aria-labelledby="tab-findings"></section>
  <section class="view" id="view-coverage" role="tabpanel" aria-labelledby="tab-coverage"></section>
  <section class="view" id="view-activity" role="tabpanel" aria-labelledby="tab-activity"></section>

  <footer class="foot" id="foot"></footer>
</div>

<script type="application/json" id="guild-data">
@@GUILD_DASHBOARD_DATA@@
</script>

<script>
(function () {
  "use strict";

  // ---- data ----------------------------------------------------------------------
  // textContent of the JSON block, never innerHTML of anything. The block cannot have
  // been closed early: `guild dashboard` guarantees the payload holds no `<` byte.
  var DATA = { meta: {}, summary: {}, goals: [], phases: [], requirements: [], tasks: [],
               bugs: [], findings: [], coverage: [], activity: [],
               graph: { nodes: [], edges: [] } };
  var PARSE_ERROR = "";
  try {
    var raw = document.getElementById("guild-data").textContent;
    var parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object") {
      for (var k in DATA) { if (parsed[k] !== undefined && parsed[k] !== null) DATA[k] = parsed[k]; }
      if (!DATA.graph || typeof DATA.graph !== "object") DATA.graph = { nodes: [], edges: [] };
      if (!DATA.graph.nodes) DATA.graph.nodes = [];
      if (!DATA.graph.edges) DATA.graph.edges = [];
    }
  } catch (e) {
    PARSE_ERROR = String(e && e.message ? e.message : e);
  }

  var S = DATA.summary || {};
  function num(k) { var v = S[k]; return typeof v === "number" ? v : 0; }

  // ---- DOM helpers ----------------------------------------------------------------
  // el() is the ONLY node factory, and it sets text with textContent. There is no
  // html() helper on purpose: the absence of one is the invariant.
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null && text !== "") n.textContent = String(text);
    return n;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) { if (arguments[i]) parent.appendChild(arguments[i]); }
    return parent;
  }
  function txt(v, fallback) {
    if (v === undefined || v === null) return fallback === undefined ? "" : fallback;
    if (typeof v === "string") return v;
    if (typeof v === "number" || typeof v === "boolean") return String(v);
    return fallback === undefined ? "" : fallback;
  }
  function clip(v, n) {
    var s = txt(v);
    return s.length > n ? s.slice(0, n - 1) + "…" : s;
  }
  function intOf(v) { return typeof v === "number" && isFinite(v) ? Math.floor(v) : 0; }

  // pick — an OWN-PROPERTY lookup on an object literal, and the only way this file reads
  // a map whose key came from the database.
  //
  // `{}` inherits `__proto__`, `constructor`, `toString` and the rest from
  // Object.prototype, so `MAP[key]` with a key a user typed is not a lookup — it is a
  // lookup OR an inherited function OR the prototype itself. `coverage.risk =
  // 'constructor'` made `STALE_DAYS[risk]` return the Object constructor, `days >= limit`
  // NaN, and an area last inspected in 2020 render as "current" — in the view whose entire
  // purpose is "what has nobody looked at in a month?". Every free-text key on this page
  // goes through here, or through a `"prefix:"` namespace where the map is built as well
  // as read (see viewRoadmap and viewGraph).
  function pick(map, key, fallback) {
    return Object.prototype.hasOwnProperty.call(map, key) ? map[key] : fallback;
  }

  // ---- time (computed at view time, never baked into the file) ---------------------
  function daysSince(iso) {
    var s = txt(iso);
    if (!s) return null;
    var t = Date.parse(s.length === 10 ? s + "T00:00:00Z" : s);
    if (isNaN(t)) return null;
    return Math.floor((Date.now() - t) / 86400000);
  }
  function ago(iso) {
    var s = txt(iso);
    if (!s) return "";
    var t = Date.parse(s.length === 10 ? s + "T00:00:00Z" : s);
    if (isNaN(t)) return "";
    var m = Math.floor((Date.now() - t) / 60000);
    if (m < 0) return "in the future";
    if (m < 1) return "just now";
    if (m < 60) return m + "m ago";
    if (m < 1440) return Math.floor(m / 60) + "h ago";
    return Math.floor(m / 1440) + "d ago";
  }

  // ---- shared pieces ---------------------------------------------------------------
  var STATUS_TONE = {
    done: "ok", fixed: "ok", approved: "ok", pass: "ok",
    "in-progress": "info", fixing: "info", ready: "info", running: "info",
    todo: "", pending: "", waived: "", wontfix: "", skipped: "",
    blocked: "warn", issues: "warn",
    failed: "bad", open: "warn", critical: "bad", rejected: "bad"
  };
  function statusPill(v) {
    var s = txt(v, "unknown");
    return el("span", "pill " + pick(STATUS_TONE, s, ""), s);
  }
  function sevPill(v) {
    var s = txt(v, "unknown");
    var tone = s === "critical" ? "bad" : s === "major" ? "warn" : s === "minor" ? "info" : "";
    return el("span", "pill " + tone, s);
  }
  function progress(done, total) {
    var d = intOf(done), t = intOf(total);
    var box = el("span", "bar");
    var fill = el("i");
    fill.style.width = (t > 0 ? Math.round((d / t) * 100) : 0) + "%";
    box.appendChild(fill);
    var wrap = el("span", "row");
    wrap.style.gap = "8px";
    add(wrap, box, el("span", "meta", d + "/" + t));
    return wrap;
  }
  function emptyState(head, body) {
    var box = el("div", "empty");
    add(box, el("strong", null, head));
    box.appendChild(document.createTextNode(txt(body)));
    return box;
  }
  function table(headers) {
    var box = el("div", "scroll");
    var t = el("table");
    var thead = el("thead"), tr = el("tr");
    for (var i = 0; i < headers.length; i++) tr.appendChild(el("th", null, headers[i]));
    thead.appendChild(tr);
    var tb = el("tbody");
    add(t, thead, tb);
    box.appendChild(t);
    return { box: box, body: tb };
  }
  function cell(row, text, cls) {
    var td = el("td", cls || null, text);
    row.appendChild(td);
    return td;
  }
  function cellNode(row, node, cls) {
    var td = el("td", cls || null);
    if (node) td.appendChild(node);
    row.appendChild(td);
    return td;
  }
  function truncNote(shown, total, noun) {
    if (intOf(total) <= shown) return null;
    return el("p", "hint", "Showing " + shown + " of " + intOf(total) + " " + noun +
      " — the rest are in the database; query them with the guild CLI.");
  }

  // ---- 1 · roadmap -------------------------------------------------------------------
  function viewRoadmap(root) {
    var goals = DATA.goals, phases = DATA.phases, reqs = DATA.requirements;

    var byGoal = {}, byPhase = {}, unattached = [];
    var i, p, r;
    for (i = 0; i < phases.length; i++) {
      p = phases[i];
      var gk = "g:" + txt(p.goal_id);
      if (!byGoal[gk]) byGoal[gk] = [];
      byGoal[gk].push(p);
    }
    for (i = 0; i < reqs.length; i++) {
      r = reqs[i];
      if (!txt(r.phase_id)) { unattached.push(r); continue; }
      var pk = "p:" + txt(r.phase_id);
      if (!byPhase[pk]) byPhase[pk] = [];
      byPhase[pk].push(r);
    }

    // The heading is appended BEFORE the empty-state branch, unlike the first draft, which
    // returned above it — so Roadmap, the default tab, greeted a new guild with an
    // unheaded grey box while every other view named itself first.
    root.appendChild(el("h2", null, "Roadmap"));

    if (!goals.length && !reqs.length) {
      root.appendChild(emptyState("No direction declared yet",
        "Create a goal with `guild goal new`, phases with `guild phase new`, and the first requirement with the guild:new-requirement skill."));
      return;
    }

    root.appendChild(el("p", "hint", "Goals hold phases; phases hold requirements. Progress is counted live from the board."));

    for (i = 0; i < goals.length; i++) {
      var g = goals[i];
      var card = el("div", "card goal");
      var head = el("div", "row spread");
      var left = el("div", "row");
      add(left, el("span", "id", txt(g.id)), el("span", "title", txt(g.title, "(untitled)")));
      var right = el("div", "row");
      add(right, el("span", "pill", "p" + intOf(g.priority)), statusPill(g.status),
        progress(g.req_done, g.req_total));
      add(head, left, right);
      card.appendChild(head);

      var ps = byGoal["g:" + txt(g.id)] || [];
      if (!ps.length) {
        card.appendChild(el("p", "meta", "No phases yet."));
      }
      for (var j = 0; j < ps.length; j++) {
        var ph = ps[j];
        var pbox = el("div", "phase");
        var phead = el("div", "row spread");
        var pl = el("div", "row");
        add(pl, el("span", "id", txt(ph.id)),
          el("span", "title", intOf(ph.ordinal) + ". " + txt(ph.title, "(untitled)")));
        var prt = el("div", "row");
        add(prt, statusPill(ph.status), progress(ph.req_done, ph.req_total));
        add(phead, pl, prt);
        pbox.appendChild(phead);

        var rs = byPhase["p:" + txt(ph.id)] || [];
        for (var k = 0; k < rs.length; k++) pbox.appendChild(reqLine(rs[k]));
        if (!rs.length) pbox.appendChild(el("p", "meta", "No requirements in this phase."));
        card.appendChild(pbox);
      }
      root.appendChild(card);
    }

    if (!goals.length) {
      root.appendChild(el("p", "hint",
        "No goals are declared, so every requirement below is unaffiliated. `guild goal new` gives them a home."));
    }
    if (unattached.length) {
      var ucard = el("div", "card");
      ucard.appendChild(el("div", "title", "Unaffiliated requirements"));
      ucard.appendChild(el("p", "meta", "Tracked work that no phase claims yet."));
      for (i = 0; i < unattached.length; i++) ucard.appendChild(reqLine(unattached[i]));
      root.appendChild(ucard);
    }
    var note = truncNote(reqs.length, num("req_total"), "requirement(s)");
    if (note) root.appendChild(note);
  }

  function reqLine(r) {
    var line = el("div", "reqline");
    add(line, el("span", "id", txt(r.id)), el("span", "title", txt(r.title, "(untitled)")),
      statusPill(r.status), el("span", "pill", "p" + intOf(r.priority)),
      progress(r.tasks_done, r.tasks_total));
    if (intOf(r.bugs_open) > 0) line.appendChild(el("span", "pill bad", intOf(r.bugs_open) + " open bug(s)"));
    return line;
  }

  // ---- 2 · board ---------------------------------------------------------------------
  var BOARD_COLS = [
    { key: "in-progress", label: "In progress" },
    { key: "todo", label: "Todo" },
    { key: "blocked", label: "Blocked" },
    { key: "done", label: "Done" },
    { key: "failed", label: "Failed" },
    { key: "waived", label: "Waived" }
  ];

  function viewBoard(root) {
    var tasks = DATA.tasks;
    root.appendChild(el("h2", null, "Board"));
    if (!tasks.length) {
      root.appendChild(emptyState("No tasks on the board",
        "Requirements grow tasks when the architect plans them. Start with the guild:new-requirement skill."));
      return;
    }
    root.appendChild(el("p", "hint", "Tasks by status. The left edge is priority: p1 urgent through p5 idle."));

    var controls = el("div", "controls");
    var lab = el("label", null, "Requirement:");
    lab.setAttribute("for", "req-filter");
    var sel = el("select");
    sel.id = "req-filter";
    var opt = el("option", null, "All requirements");
    opt.value = "";
    sel.appendChild(opt);
    var seen = {}, i;
    for (i = 0; i < DATA.requirements.length; i++) {
      var r = DATA.requirements[i];
      var o = el("option", null, txt(r.id) + " — " + clip(txt(r.title, "(untitled)"), 60));
      o.value = txt(r.id);
      seen[txt(r.id)] = 1;
      sel.appendChild(o);
    }
    for (i = 0; i < tasks.length; i++) {
      var rid = txt(tasks[i].requirement_id);
      if (rid && !seen[rid]) {
        var o2 = el("option", null, rid);
        o2.value = rid;
        seen[rid] = 1;
        sel.appendChild(o2);
      }
    }
    add(controls, lab, sel);
    root.appendChild(controls);

    var board = el("div", "board");
    root.appendChild(board);
    var note = truncNote(tasks.length, num("tasks_total"), "task(s)");
    if (note) root.appendChild(note);

    function draw() {
      var want = sel.value;
      while (board.firstChild) board.removeChild(board.firstChild);
      var drawn = 0;
      for (var c = 0; c < BOARD_COLS.length; c++) {
        var spec = BOARD_COLS[c];
        var rows = [];
        for (var t = 0; t < tasks.length; t++) {
          if (txt(tasks[t].status) !== spec.key) continue;
          if (want && txt(tasks[t].requirement_id) !== want) continue;
          rows.push(tasks[t]);
        }
        if (!rows.length && spec.key !== "todo" && spec.key !== "in-progress") continue;
        drawn++;
        var col = el("div", "col");
        var h = el("h3");
        add(h, el("span", null, spec.label), el("span", null, String(rows.length)));
        col.appendChild(h);
        if (!rows.length) col.appendChild(el("p", "meta", "Nothing here."));
        for (var q = 0; q < rows.length; q++) col.appendChild(taskCard(rows[q]));
        board.appendChild(col);
      }
      if (!drawn) board.appendChild(emptyState("Nothing matches that filter", ""));
    }
    sel.addEventListener("change", draw);
    draw();
  }

  function taskCard(t) {
    var pr = intOf(t.priority);
    if (pr < 1 || pr > 5) pr = 3;
    var card = el("div", "task pr" + pr);
    add(card, el("div", "id", txt(t.id)), el("div", "title", txt(t.title, "(untitled)")));
    var meta = el("div", "row");
    meta.style.marginTop = "6px";
    add(meta, el("span", "pill", txt(t.agent, "unassigned")));
    if (txt(t.requirement_id)) meta.appendChild(el("span", "pill info", txt(t.requirement_id)));
    if (txt(t.parallel_group)) meta.appendChild(el("span", "pill", "group " + txt(t.parallel_group)));
    if (intOf(t.findings_open) > 0) meta.appendChild(el("span", "pill bad", intOf(t.findings_open) + " finding(s)"));
    card.appendChild(meta);
    if (txt(t.waiting_on)) card.appendChild(el("div", "meta", "waiting on " + txt(t.waiting_on)));
    var when = txt(t.claimed_at) || txt(t.updated_at);
    if (when) {
      var a = ago(when);
      card.appendChild(el("div", "meta", a ? when + " · " + a : when));
    }
    return card;
  }

  // ---- 3 · graph ---------------------------------------------------------------------
  function viewGraph(root) {
    var nodes = DATA.graph.nodes, edges = DATA.graph.edges;
    root.appendChild(el("h2", null, "Execution graph"));

    if (!nodes.length) {
      root.appendChild(emptyState("No execution graphs yet (Stage 4)",
        "The architect emits a per-requirement graph of work nodes and gates, and the orchestrator compiles each gate-free segment into a workflow. " +
        "That machinery lands in Stage 4; the graph_node and graph_edge tables exist and are empty, so there is nothing to draw — " +
        "this view is waiting, not broken."));
      return;
    }

    root.appendChild(el("p", "hint",
      "One diagram per requirement, emitted as Mermaid in a `pre.mermaid` block. In this " +
      "local file that is the diagram's source, which you can read or paste into any Mermaid " +
      "renderer — the file ships no diagram library, because it embeds nothing it cannot carry " +
      "offline. Published as an Artifact, the same blocks are drawn natively by the host."));

    // EVERY MAP KEYED BY DATABASE TEXT IS NAMESPACED. `graph_node.id` is a free-text
    // TEXT PRIMARY KEY, so `edgeBy[id]` and `ids[id]` are lookups on Object.prototype for
    // an id of `__proto__` — `edgeBy["__proto__"]` reads back the prototype (truthy), the
    // array is never created, and `.push` is not a function, which replaced this entire
    // view with an error message. `ids["__proto__"] = "n0"` fails differently and worse:
    // it writes nowhere, reads back as `[object Object]`, and the Mermaid source is
    // silently corrupt. A `"e:"` / `"n:"` prefix makes every key a plain string key, the
    // same fix `"g:"`, `"p:"` and `"r:"` already apply above.
    var order = [], byReq = {}, i;
    for (i = 0; i < nodes.length; i++) {
      var rid = txt(nodes[i].requirement_id, "(unattached)");
      if (!byReq["r:" + rid]) { byReq["r:" + rid] = []; order.push(rid); }
      byReq["r:" + rid].push(nodes[i]);
    }
    var edgeBy = {};
    for (i = 0; i < edges.length; i++) {
      var f = "e:" + txt(edges[i].from);
      if (!edgeBy[f]) edgeBy[f] = [];
      edgeBy[f].push(txt(edges[i].to));
    }

    for (i = 0; i < order.length; i++) {
      var rid2 = order[i];
      var ns = byReq["r:" + rid2];
      var card = el("div", "card");
      card.appendChild(el("div", "title", rid2));
      var ids = {}, j;
      for (j = 0; j < ns.length; j++) ids["n:" + txt(ns[j].id)] = "n" + j;

      var lines = ["flowchart TD"];
      for (j = 0; j < ns.length; j++) {
        var n = ns[j];
        var label = txt(n.node_key, "node") + " [" + txt(n.status, "?") + "]";
        // Mermaid label text is quoted and stripped of everything that could close the
        // quote or the shape — the delimiters, plus BACKSLASH, CR and LF. A node_key
        // ending in `\` would otherwise escape the closing quote and corrupt the rest of
        // the diagram, and a newline would split the line into two statements. The page is
        // safe either way (this string lands in a text node); the DIAGRAM is what this
        // guards.
        label = label.replace(/["\[\]{}()<>|\\\r\n]/g, " ");
        lines.push("  " + ids["n:" + txt(n.id)] + (txt(n.kind) === "gate" ? "{{\"" : "[\"") +
          label + (txt(n.kind) === "gate" ? "\"}}" : "\"]"));
        // Status is carried by a classDef rather than only by the label, so a rendered
        // diagram is colored by status the way a source-only one never was.
        lines.push("  class " + ids["n:" + txt(n.id)] + " s_" + slug(txt(n.status, "unknown")));
      }
      for (j = 0; j < ns.length; j++) {
        var outs = edgeBy["e:" + txt(ns[j].id)] || [];
        for (var k = 0; k < outs.length; k++) {
          if (ids["n:" + outs[k]])
            lines.push("  " + ids["n:" + txt(ns[j].id)] + " --> " + ids["n:" + outs[k]]);
        }
      }
      for (j = 0; j < GRAPH_CLASSDEFS.length; j++) lines.push("  " + GRAPH_CLASSDEFS[j]);
      card.appendChild(el("pre", "mermaid", lines.join("\n")));
      root.appendChild(card);
    }
    var gnote = truncNote(nodes.length, num("graph_nodes"), "graph node(s)");
    if (gnote) root.appendChild(gnote);
    var enote = truncNote(edges.length, num("graph_edges"), "graph edge(s)");
    if (enote) root.appendChild(enote);
  }

  // A Mermaid class name is an identifier, and `status` is database text — so it is
  // slugged rather than interpolated, and an unrecognized status simply matches no
  // classDef and draws with the default style.
  function slug(s) {
    return String(s).replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 24) || "unknown";
  }
  var GRAPH_CLASSDEFS = [
    "classDef s_done fill:#d7f0e0,stroke:#2c7a4b,color:#111",
    "classDef s_in_progress fill:#dde4fb,stroke:#3b5bdb,color:#111",
    "classDef s_blocked fill:#faeccc,stroke:#a4700a,color:#111",
    "classDef s_failed fill:#f7d9d9,stroke:#c23b3b,color:#111",
    "classDef s_todo fill:#eceff4,stroke:#6b7280,color:#111",
    "classDef s_pending fill:#eceff4,stroke:#6b7280,color:#111",
    "classDef s_waived fill:#eceff4,stroke:#9aa1ad,color:#111"
  ];

  // ---- 4 · bugs ------------------------------------------------------------------------
  function viewBugs(root) {
    var bugs = DATA.bugs;
    root.appendChild(el("h2", null, "Bugs"));
    if (!bugs.length) {
      root.appendChild(emptyState("No open defects",
        "Bugs are filed with `guild bug new` — by the QA discipline, by a reviewer, or by you."));
      return;
    }
    root.appendChild(el("p", "hint", "Open and in-flight defects, worst severity first, with the task that fixes each."));
    var t = table(["Bug", "Severity", "Status", "Title", "Found by", "Requirement", "Fix task", "Filed"]);
    for (var i = 0; i < bugs.length; i++) {
      var b = bugs[i], tr = el("tr");
      cell(tr, txt(b.id), "mono");
      cellNode(tr, sevPill(b.severity));
      cellNode(tr, statusPill(b.status));
      cell(tr, txt(b.title, "(untitled)"), "wrap-cell");
      cell(tr, txt(b.found_by, "unknown"));
      cell(tr, txt(b.requirement_id, "—"), "mono");
      cell(tr, txt(b.fix_task_id, "none yet"), "mono");
      cell(tr, txt(b.created_at));
      t.body.appendChild(tr);
    }
    root.appendChild(t.box);
    var note = truncNote(bugs.length, num("bugs_open"), "open bug(s)");
    if (note) root.appendChild(note);
  }

  // ---- 5 · findings ---------------------------------------------------------------------
  //
  // "WHAT DID REVIEWERS FLAG THAT WE NEVER FIXED?" In v4 the answer was prose buried in a
  // per-task markdown work log, and getting it meant reading every log. In v5 it is the
  // `review_finding` table, and this view is that query — which is why the red summary
  // tile now LINKS here instead of being a number that names nobody. A task can be failed
  // over three findings and appear in no section of `guild brief`; here it is a row.
  //
  // GROUPED BY SEVERITY, worst first. The engine already ordered the rows unresolved-first
  // and then by severity and id, so this only buckets — the order inside a group is the
  // engine's, which is what keeps the page deterministic without a sort here.
  //
  // RESOLVED FINDINGS ARE PRESENT BUT NOT NOISY. The filter opens on open+fixing, the
  // state that still owes somebody work; a fixed finding is the evidence that the flag was
  // answered, and dropping it would make "nobody looked" indistinguishable from "somebody
  // looked and fixed it".
  var SEV_ORDER = ["critical", "major", "minor", "nit"];
  var SEV_LABEL = { critical: "Critical", major: "Major", minor: "Minor", nit: "Nit" };
  var SEV_TONE = { critical: "bad", major: "warn", minor: "info", nit: "" };

  // `open` and `fixing` are the two dispositions that still owe work. schema.sql also
  // names `fixed` and `waived`; anything else a future writer stores counts as resolved
  // rather than being dropped, because a finding this page cannot classify is still a
  // finding, and losing one silently is the exact failure this view exists to prevent.
  // Read through pick(), like every other map on this page keyed by database text.
  var OPEN_DISPOSITIONS = { open: 1, fixing: 1 };
  function findingIsOpen(f) { return pick(OPEN_DISPOSITIONS, txt(f.disposition), 0) === 1; }

  // file:line, or an em dash. `line` is an INTEGER column, so it is a JSON number or null;
  // a missing one must not render as `path:0`.
  function findingWhere(f) {
    var p = txt(f.file);
    if (!p) return el("span", "meta", "—");
    if (typeof f.line === "number" && isFinite(f.line)) p += ":" + intOf(f.line);
    return el("span", "mono", p);
  }

  function findingTable(rows) {
    var t = table(["#", "Task", "Reviewer", "What was flagged", "Where", "State", "Fix task", "Filed"]);
    for (var i = 0; i < rows.length; i++) {
      var f = rows[i], tr = el("tr");
      cell(tr, txt(f.id), "mono");
      // The task, named rather than referenced: `review_finding` stores an id, and a
      // column of bare `TASK-007`s is the count problem again one level down.
      var task = el("td", "wrap-cell");
      add(task, el("div", "id", txt(f.task_id, "—")),
        el("div", "meta", clip(txt(f.task_title, "(no task on the board)"), 90)));
      tr.appendChild(task);
      cell(tr, txt(f.reviewer, "unknown"));
      var what = el("td", "wrap-cell");
      add(what, el("div", "title", txt(f.summary, "(no summary)")));
      if (txt(f.detail)) what.appendChild(el("div", "meta", txt(f.detail)));
      tr.appendChild(what);
      cellNode(tr, findingWhere(f));
      cellNode(tr, statusPill(f.disposition));
      cell(tr, txt(f.fix_task_id, "none linked"), "mono");
      var when = txt(f.created_at);
      var rel = ago(when);
      cell(tr, when ? (rel ? when + " · " + rel : when) : "");
      t.body.appendChild(tr);
    }
    return t.box;
  }

  function viewFindings(root) {
    var findings = DATA.findings, i;
    root.appendChild(el("h2", null, "Findings"));

    if (!findings.length) {
      root.appendChild(emptyState("No review findings yet",
        "Reviewers file them against a task with `guild finding <TASK-ID> --reviewer R " +
        "--severity critical|major|minor|nit --summary '…'`, and they reach the board when " +
        "that task's spool is drained. An empty ledger means nobody has flagged anything — " +
        "not that the flags were lost."));
      return;
    }

    var nOpen = 0;
    for (i = 0; i < findings.length; i++) { if (findingIsOpen(findings[i])) nOpen++; }
    var nResolved = findings.length - nOpen;

    root.appendChild(el("p", "hint",
      "What reviewers flagged, and whether it was ever fixed — grouped by severity, worst " +
      "first, and inside each group the unresolved ones come first. " + nOpen +
      " open or being fixed, " + nResolved + " resolved."));

    var controls = el("div", "controls");
    var lab = el("label", null, "Show:");
    lab.setAttribute("for", "finding-filter");
    var sel = el("select");
    sel.id = "finding-filter";
    var opts = [
      { v: "open", t: "Open & fixing (" + nOpen + ")" },
      { v: "resolved", t: "Resolved & waived (" + nResolved + ")" },
      { v: "all", t: "All findings (" + findings.length + ")" }
    ];
    for (i = 0; i < opts.length; i++) {
      var o = el("option", null, opts[i].t);
      o.value = opts[i].v;
      sel.appendChild(o);
    }
    // Opens on the rows that owe work — unless there are none, in which case opening on an
    // empty list would read as a broken view rather than as a cleared ledger.
    sel.value = nOpen > 0 ? "open" : "all";
    add(controls, lab, sel);
    root.appendChild(controls);

    var host = el("div");
    root.appendChild(host);
    var note = truncNote(findings.length, num("findings_total"), "review finding(s)");
    if (note) root.appendChild(note);

    function draw() {
      var want = sel.value, j;
      while (host.firstChild) host.removeChild(host.firstChild);

      var rows = [];
      for (j = 0; j < findings.length; j++) {
        var isOpen = findingIsOpen(findings[j]);
        if (want === "open" && !isOpen) continue;
        if (want === "resolved" && isOpen) continue;
        rows.push(findings[j]);
      }
      if (!rows.length) {
        host.appendChild(want === "open"
          ? emptyState("Nothing is waiting on a fix",
              "Every finding on this board has been dispositioned. Switch the filter to read them.")
          : emptyState("Nothing has been resolved yet",
              "Every finding on this board is still open or being fixed."));
        return;
      }

      // The severity buckets are built AND read under an "s:" namespace, the same rule the
      // rest of this page follows: `severity` is database text and schema.sql documents
      // four values without constraining them, so a bare `by[severity]` is a read of
      // Object.prototype for a severity of `constructor`. An unrecognized severity lands in
      // "other" and is SHOWN — a finding nobody can classify is still owed to somebody.
      var by = { "s:other": [] };
      for (j = 0; j < SEV_ORDER.length; j++) by["s:" + SEV_ORDER[j]] = [];
      for (j = 0; j < rows.length; j++) {
        var k = "s:" + txt(rows[j].severity);
        if (!Object.prototype.hasOwnProperty.call(by, k) || k === "s:other") k = "s:other";
        by[k].push(rows[j]);
      }

      var order = SEV_ORDER.concat(["other"]);
      for (j = 0; j < order.length; j++) {
        var bucket = by["s:" + order[j]];
        if (!bucket.length) continue;
        var head = el("h3", "grp");
        add(head, el("span", null, pick(SEV_LABEL, order[j], "Unclassified severity")),
          el("span", "pill " + pick(SEV_TONE, order[j], ""), String(bucket.length)));
        host.appendChild(head);
        host.appendChild(findingTable(bucket));
      }
    }
    sel.addEventListener("change", draw);
    draw();
  }

  // ---- 6 · coverage ---------------------------------------------------------------------
  // "What has nobody looked at in a month?" — the thresholds mirror `guild brief`:
  // high risk goes stale at 14 days, medium at 30, low at 90.
  var STALE_DAYS = { high: 14, medium: 30, low: 90 };
  function viewCoverage(root) {
    var cov = DATA.coverage;
    root.appendChild(el("h2", null, "Coverage"));
    if (!cov.length) {
      root.appendChild(emptyState("No quality areas recorded",
        "Coverage areas describe what the product is made of, from a quality standpoint. The QA discipline seeds them; they survive releases and board resets."));
      return;
    }
    var overdue = 0, never = 0, i;
    for (i = 0; i < cov.length; i++) {
      var d = daysSince(cov[i].last_inspected_at);
      if (d === null) never++;
      else if (d >= pick(STALE_DAYS, txt(cov[i].risk), 30)) overdue++;
    }
    root.appendChild(el("p", "hint",
      "Areas go stale at 14 days (high risk), 30 (medium), 90 (low). Right now: " +
      never + " never inspected, " + overdue + " overdue."));

    var t = table(["Area", "Risk", "Last inspected", "State", "E2E spec", "Notes"]);
    for (i = 0; i < cov.length; i++) {
      var c = cov[i], tr = el("tr");
      var name = el("td", "wrap-cell");
      add(name, el("div", "title", txt(c.area, txt(c.id))), el("div", "id", txt(c.id)));
      tr.appendChild(name);
      cellNode(tr, el("span", "pill " + (txt(c.risk) === "high" ? "bad" : txt(c.risk) === "medium" ? "warn" : ""), txt(c.risk, "unknown")));
      var days = daysSince(c.last_inspected_at);
      cell(tr, txt(c.last_inspected_at) ? txt(c.last_inspected_at) + (days === null ? "" : " (" + days + "d)") : "never");
      var limit = pick(STALE_DAYS, txt(c.risk), 30);
      var state = days === null ? el("span", "pill bad", "never inspected")
        : days >= limit ? el("span", "pill warn", "overdue")
        : el("span", "pill ok", "current");
      cellNode(tr, state);
      cellNode(tr, txt(c.spec_path) ? el("span", "mono", txt(c.spec_path)) : el("span", "pill warn", "no spec"));
      cell(tr, clip(txt(c.notes), 160), "wrap-cell");
      t.body.appendChild(tr);
    }
    root.appendChild(t.box);
    var note = truncNote(cov.length, num("coverage_total"), "coverage area(s)");
    if (note) root.appendChild(note);
  }

  // ---- 7 · activity ----------------------------------------------------------------------
  //
  // THE FEED READS AS SENTENCES, NOT AS ROWS OF JSON. `{"from":"open","to":"fixing"}` in a
  // Detail column — and `{}` on every `created` row — is the writer's storage format
  // leaking into the one view whose job is to say what moved. Every piece below is still
  // placed with textContent: `payloadPhrase` runs JSON.parse over the payload and puts its
  // VALUES in text nodes, which is a data decode, not a markup decode. If the payload does
  // not parse it is shown verbatim and clipped, because an unreadable detail is still a
  // detail and dropping it silently is what this whole view is being fixed for.
  var VERB_PHRASE = {
    created: "created", moved: "moved", assigned: "assigned", retitled: "retitled",
    reprioritized: "reprioritized", "checked-in": "checked in",
    logged: "logged work on", filed: "filed a review finding on", resolved: "resolved"
  };
  // A payload key rendered as English. An unlisted key falls back to the key itself with
  // `_id` dropped and underscores spaced, which reads acceptably for anything Stage 4 adds
  // without this table having to know about it first.
  var FIELD_WORD = {
    fix_task_id: "fix task", requirement_id: "requirement", phase_id: "phase",
    goal_id: "goal", task_id: "task", severity: "severity", priority: "priority",
    agent: "agent", reviewer: "reviewer", entry: "", summary: ""
  };
  function fieldWord(k) {
    var w = pick(FIELD_WORD, k, null);
    if (w !== null) return w;
    return String(k).replace(/_id$/, "").replace(/_/g, " ");
  }
  function payloadPhrase(raw) {
    var s = txt(raw);
    if (!s || s === "{}") return "";
    var o = null;
    try { o = JSON.parse(s); } catch (err) { o = null; }
    if (!o || typeof o !== "object") return clip(s, 180);
    var bits = [], k, v, w;
    if (Object.prototype.hasOwnProperty.call(o, "from") ||
        Object.prototype.hasOwnProperty.call(o, "to")) {
      bits.push(txt(o.from, "?") + " → " + txt(o.to, "?"));
    }
    for (k in o) {
      if (!Object.prototype.hasOwnProperty.call(o, k)) continue;
      if (k === "from" || k === "to") continue;
      v = o[k];
      if (v === null || v === undefined || v === "" || typeof v === "object") continue;
      w = fieldWord(k);
      bits.push(w ? w + " " + clip(txt(v), 120) : clip(txt(v), 120));
    }
    return bits.join(", ");
  }
  function eventSentence(e) {
    var parts = [pick(VERB_PHRASE, txt(e.verb), txt(e.verb, "touched"))];
    if (txt(e.subject_type)) parts.push(txt(e.subject_type));
    if (txt(e.subject_id)) parts.push(txt(e.subject_id));
    var s = parts.join(" ");
    if (txt(e.subject_title)) s += " — " + clip(txt(e.subject_title), 90);
    var d = payloadPhrase(e.payload);
    if (d) s += "  ·  " + d;
    return s;
  }

  function viewActivity(root) {
    var ev = DATA.activity;
    root.appendChild(el("h2", null, "Activity"));
    if (!ev.length) {
      root.appendChild(emptyState("Nothing has happened yet",
        "Every mutation writes an event row. Run a check-in and the feed fills up."));
      return;
    }
    root.appendChild(el("p", "hint", "What moved, newest first — one sentence per event."));
    var t = table(["When", "", "Who", "What happened"]);
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i], tr = el("tr");
      cell(tr, txt(e.ts), "mono");
      cell(tr, ago(e.ts));
      cell(tr, txt(e.actor, "unknown"));
      cell(tr, eventSentence(e), "wrap-cell");
      t.body.appendChild(tr);
    }
    root.appendChild(t.box);
    var note = truncNote(ev.length, num("events_total"), "event(s)");
    if (note) root.appendChild(note);
  }

  // ---- chrome --------------------------------------------------------------------------
  var VIEWS = [
    { id: "roadmap", label: "Roadmap", draw: viewRoadmap },
    { id: "board", label: "Board", draw: viewBoard },
    { id: "graph", label: "Graph", draw: viewGraph },
    { id: "bugs", label: "Bugs", draw: viewBugs },
    { id: "findings", label: "Findings", draw: viewFindings },
    { id: "coverage", label: "Coverage", draw: viewCoverage },
    { id: "activity", label: "Activity", draw: viewActivity }
  ];

  // A TILE IS A HEADLINE NUMBER, AND EVERY HEADLINE NUMBER HERE HAS A VIEW BEHIND IT.
  //
  // "6 Open findings" that cannot be clicked is the count problem this dashboard exists to
  // solve, printed in the largest type on the page: it names nobody, and the reader's next
  // move — which six? — has nowhere to go. So `view` is a VIEWS id and the tile becomes an
  // anchor to `#<id>`, which the hashchange handler below already turns into a tab switch.
  //
  // The href is a SAME-DOCUMENT FRAGMENT and is set from a fixed literal in this file,
  // never from data. No request leaves the page, which is the one property this file may
  // never lose. There is no element with a bare `findings` id either, so the fragment
  // switches the view without also scrolling somewhere.
  function tile(key, label, alert, view) {
    var box = el(view ? "a" : "div", "tile" + (alert ? " alert" : ""));
    if (view) box.href = "#" + view;
    add(box, el("span", "n", String(num(key))), el("span", "k", label));
    return box;
  }

  // A PAGE THAT CANNOT READ ITS DATA MUST NOT ASSERT WHAT THE DATA SAYS.
  //
  // The old failure path drew every view from the empty defaults and put a small red
  // line under the footer: "No open defects", "No direction declared yet", every tile 0 —
  // one confident claim per view about a board the page had just failed to read, and the one
  // correction below all of them. The escaping makes this unreachable in practice, which is
  // exactly why it has to be right: it is the designated failure mode and nobody watches
  // it. So the banner goes FIRST, nothing is drawn, and no number is printed.
  function failClosed() {
    document.getElementById("hdr-sub").textContent =
      "the inlined data could not be read — this page is showing nothing, not zero";
    var box = el("div", "empty");
    box.style.borderColor = "var(--bad)";
    box.style.borderStyle = "solid";
    add(box, el("strong", null, "This dashboard could not read its own data"));
    box.appendChild(document.createTextNode(
      "The inlined JSON did not parse (" + PARSE_ERROR + "), so no view is drawn: every " +
      "count and every “nothing here” it could print would be a claim about a board it " +
      "never loaded. Re-run `guild dashboard`; if it repeats, report it — the file is " +
      "generated, not edited."));
    var content = document.getElementById("content");
    content.insertBefore(box, content.firstChild);
    document.getElementById("foot").textContent =
      "Generated by `guild dashboard`. Rendered " + new Date().toLocaleString() + ".";
  }

  function chrome() {
    if (PARSE_ERROR) { failClosed(); return; }

    var sub = document.getElementById("hdr-sub");
    var m = DATA.meta || {};
    var bits = [];
    if (txt(m.last_checkin)) bits.push("last check-in " + txt(m.last_checkin));
    if (txt(m.latest_event_at)) bits.push("newest event " + txt(m.latest_event_at));
    bits.push(num("req_total") + " requirement(s), " + num("tasks_total") + " task(s)");
    sub.textContent = bits.join(" · ");

    var tiles = document.getElementById("tiles");
    add(tiles,
      tile("req_total", "Requirements", false, "roadmap"),
      tile("tasks_in_progress", "In flight", false, "board"),
      tile("tasks_todo", "Todo", false, "board"),
      tile("bugs_open", "Open bugs", num("bugs_critical") > 0, "bugs"),
      tile("findings_open", "Open findings", num("findings_open") > 0, "findings"),
      tile("tasks_failed", "Failed", num("tasks_failed") > 0, "board"));

    var tabs = document.getElementById("tabs");
    var buttons = [];
    function show(id) {
      for (var i = 0; i < VIEWS.length; i++) {
        var on = VIEWS[i].id === id;
        buttons[i].setAttribute("aria-selected", on ? "true" : "false");
        var sec = document.getElementById("view-" + VIEWS[i].id);
        if (on) sec.className = "view on"; else sec.className = "view";
      }
      if (window.location.hash !== "#" + id) {
        try { window.history.replaceState(null, "", "#" + id); } catch (err) { /* file:// */ }
      }
    }
    for (var i = 0; i < VIEWS.length; i++) {
      (function (v) {
        var b = el("button", null, v.label);
        b.id = "tab-" + v.id;
        b.type = "button";
        b.setAttribute("role", "tab");
        b.setAttribute("aria-controls", "view-" + v.id);
        b.setAttribute("aria-selected", "false");
        b.addEventListener("click", function () { show(v.id); });
        buttons.push(b);
        tabs.appendChild(b);
        var root = document.getElementById("view-" + v.id);
        try {
          v.draw(root);
        } catch (err) {
          root.appendChild(emptyState("This view could not be rendered", String(err && err.message ? err.message : err)));
        }
      })(VIEWS[i]);
    }

    var want = String(window.location.hash || "").replace(/^#/, "");
    var ok = false;
    for (i = 0; i < VIEWS.length; i++) { if (VIEWS[i].id === want) ok = true; }
    show(ok ? want : "roadmap");
    window.addEventListener("hashchange", function () {
      var h = String(window.location.hash || "").replace(/^#/, "");
      for (var j = 0; j < VIEWS.length; j++) { if (VIEWS[j].id === h) show(h); }
    });

    var foot = document.getElementById("foot");
    foot.textContent = "Generated by `guild dashboard` from the guild database (schema v" +
      txt(DATA.meta.schema_version, "?") + "). Self-contained: no network, no build step. " +
      "Rendered " + new Date().toLocaleString() + ".";
  }

  chrome();
})();
</script>
</body>
</html>
